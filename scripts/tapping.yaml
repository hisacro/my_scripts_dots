TIMING:
    TAP_MILLISEC: 200
    DOUBLE_TAP_MILLISEC: 150

MAPPINGS:
    - KEY: KEY_TAB
      TAP: KEY_TAB
      HOLD: KEY_LEFTALT

    - KEY: KEY_CAPSLOCK
      TAP: KEY_ESC
      HOLD: KEY_LEFTMETA

    - KEY: KEY_SEMICOLON
      TAP: KEY_SEMICOLON
      HOLD: KEY_RIGHTCTRL

    - KEY: KEY_LEFTSHIFT
      TAP: [ KEY_RIGHTSHIFT, KEY_SEMICOLON, ]
      HOLD: KEY_LEFTSHIFT

    - KEY: KEY_SYSRQ 
      TAP: KEY_SYSRQ 
      HOLD: KEY_LEFTMETA
